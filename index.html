<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>MediTrace v2</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: healthcare workstation. Left sidebar (logo on a white plate, role-specific nav), sticky top bar with
     notifications + theme, content as rounded cards. Brand: navy + teal on white; a deep-navy dark theme. */
  :root {
    --c-bg: 243 246 250; --c-surface: 255 255 255; --c-raised: 236 241 247; --c-line: 214 223 234;
    --c-fg: 12 35 64; --c-muted: 82 100 126; --c-accent: 13 128 140; --c-navy: 17 56 104;
    --c-crit: 196 30 48; --c-high: 176 76 0; --c-mod: 138 102 0; --c-ok: 3 120 80; --c-info: 92 70 205;
    --f-display: "Manrope", "Segoe UI", system-ui, sans-serif;
    --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --shadow: 0 1px 2px rgb(12 35 64 / .05), 0 6px 20px -10px rgb(12 35 64 / .14);
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --c-bg: 7 18 33; --c-surface: 12 29 50; --c-raised: 19 41 68; --c-line: 33 59 91;
    --c-fg: 229 237 245; --c-muted: 140 160 186; --c-accent: 62 196 204; --c-navy: 128 168 228;
    --c-crit: 255 116 116; --c-high: 255 166 86; --c-mod: 236 203 96; --c-ok: 96 212 160; --c-info: 172 152 255;
    --shadow: none; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --c-bg: 7 18 33; --c-surface: 12 29 50; --c-raised: 19 41 68; --c-line: 33 59 91;
    --c-fg: 229 237 245; --c-muted: 140 160 186; --c-accent: 62 196 204; --c-navy: 128 168 228;
    --c-crit: 255 116 116; --c-high: 255 166 86; --c-mod: 236 203 96; --c-ok: 96 212 160; --c-info: 172 152 255;
    --shadow: none; color-scheme: dark;
  }
  html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
    transition: background-color .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease !important;
  }
  html, body { background: rgb(var(--c-bg)); color: rgb(var(--c-fg)); }
  body { margin: 0; font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .font-display { font-family: var(--f-display); letter-spacing: -.01em; }
  .font-mono { font-family: var(--f-mono); }
  .tnum { font-variant-numeric: tabular-nums; }
  .eyebrow { font-family: var(--f-display); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: rgb(var(--c-muted)); font-weight: 700; }
  .card-shadow { box-shadow: var(--shadow); }
  h1, h2, h3 { text-wrap: balance; }
  :focus-visible { outline: 2px solid rgb(var(--c-accent)); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: rgb(var(--c-accent) / .3); }
  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .doc-line.hl { background: rgb(var(--c-accent) / .14); box-shadow: inset 3px 0 0 rgb(var(--c-accent)); }
  mark.src { background: rgb(var(--c-mod) / .28); color: inherit; border-radius: 2px; padding: 0 1px; }
  .logo-plate { background: #ffffff; }
  /* Single-column grids shrink to the screen instead of growing to their widest child (Tailwind grid-cols-* overrides this). */
  .grid { grid-template-columns: minmax(0, 1fr); }
  input, select, textarea { font: inherit; }
  .qr svg { width: 100%; height: 100%; display: block; }
  /* v2: pulsing status badges (disabled for reduced motion by the global rule below) */
  @keyframes mt-pulse { 0% { box-shadow: 0 0 0 0 rgb(var(--pulse) / .5); } 70% { box-shadow: 0 0 0 8px rgb(var(--pulse) / 0); } 100% { box-shadow: 0 0 0 0 rgb(var(--pulse) / 0); } }
  .mt-pulse { animation: mt-pulse 1.8s ease-out infinite; }
  @keyframes mt-pop { from { transform: translateY(8px); opacity: .0; } to { transform: none; opacity: 1; } }
  .pop { animation: mt-pop .25s ease-out both; }
  @keyframes mt-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  #boot { min-height: 80vh; display: grid; place-items: center; text-align: center; padding: 24px 16px; }
  #boot .plate { background: #fff; border-radius: 20px; padding: 18px 22px; box-shadow: var(--shadow); border: 1px solid rgb(var(--c-line)); }
  #boot img { width: min(340px, 78vw); height: auto; display: block; }
  #boot .bar { margin: 18px auto 0; width: 160px; height: 3px; border-radius: 3px; background: rgb(var(--c-line)); overflow: hidden; position: relative; }
  #boot .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: rgb(var(--c-accent)); border-radius: 3px; animation: mt-load 1.1s ease-in-out infinite; }
  @keyframes mt-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  #boot p { color: rgb(var(--c-muted)); font-size: 13px; margin-top: 12px; }
</style>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('meditrace-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.classList.toggle('dark', t === 'dark');
  })();
</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  var c = function (v) { return 'rgb(var(--c-' + v + ') / <alpha-value>)'; };
  tailwind.config = {
    darkMode: ['selector', '[data-theme="dark"]'],
    theme: { extend: {
      colors: { bg: c('bg'), surface: c('surface'), raised: c('raised'), line: c('line'), fg: c('fg'), muted: c('muted'),
        accent: c('accent'), navy: c('navy'), crit: c('crit'), high: c('high'), mod: c('mod'), ok: c('ok'), info: c('info') },
      fontFamily: { display: ['Manrope', 'system-ui', 'sans-serif'] },
    } }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>window.react = window.React;</script>
<script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root">
  <div id="boot" role="status" aria-live="polite">
    <div>
      <div class="plate"><img src="assets/logo.jpg" alt="MediTrace — Connected Medications. Continuity of Care." width="1230" height="390"></div>
      <div class="bar"></div>
      <p>Loading MediTrace…</p>
    </div>
  </div>
</div>
<script type="text/babel" data-presets="react" src="js/core.js"></script>
<script type="text/babel" data-presets="react" src="js/ui.js"></script>
<script type="text/babel" data-presets="react" src="js/recon.js"></script>
<script type="text/babel" data-presets="react" src="js/auth.js"></script>
<script type="text/babel" data-presets="react" src="js/patient.js"></script>
<script type="text/babel" data-presets="react" src="js/history.js"></script>
<script type="text/babel" data-presets="react" src="js/doctor.js"></script>
<script type="text/babel" data-presets="react" src="js/constraints.js"></script>
<script type="text/babel" data-presets="react" src="js/security.js"></script>
<script type="text/babel" data-presets="react" src="js/analytics.js"></script>
<script type="text/babel" data-presets="react" src="js/app.js"></script>
</body>
</html>
